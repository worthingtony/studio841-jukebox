name: "Studio 841 Jukebox"
# Bump on EVERY deploy: the app is built from a git branch, so without a bump the
# version string is the same before and after a push and a stale build is invisible.
version: "0.2.0"
slug: "studio841_jukebox"
description: "Hands-off guest jukebox for VirtualDJ - drives Automix by posing as a VirtualDJ Remote"
url: "https://github.com/worthingtony/studio841-jukebox"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false

# Host network: the app announces itself on the LAN with Bonjour (_vdjremote8._tcp) and
# VirtualDJ connects in to remote_port. Both need the host's own interface.
host_network: true

# Guests will reach this app's request page from the open guest Wi-Fi. So it gets no
# access to Home Assistant or the Supervisor: a bug in a guest-facing page then reaches
# only this container. It talks to HA only by publishing MQTT (a later version).
hassio_api: false
homeassistant_api: false

# Status page, Tony only: through HA ingress (behind HA login). The server also refuses
# anything that isn't HA's ingress proxy, since host networking puts it on the LAN too.
ingress: true
ingress_port: 8841  # 8099 is already taken on the Pi host (answered 200, 2026-10-25)
panel_title: "Jukebox"
panel_icon: mdi:music-circle

options:
  remote_name: "Studio 841 Jukebox"
  remote_port: 4250
  catalogue: "mylists:/party.subfolders"
  autopilot: false
  runway: 6
  history_hours: 3
  log_level: info
  mqtt_host: "127.0.0.1"
  mqtt_port: 1883

schema:
  # The name VirtualDJ shows on its Remote accept list. Changing it means accepting again.
  remote_name: str
  remote_port: port
  # VirtualDJ folder path of the curated playlist, e.g. mylists:/<playlist name>.subfolders
  catalogue: str
  # On: keep `runway` songs queued in Automix, adding fallbacks that flow from the last one.
  autopilot: bool
  runway: int(1,30)
  # A fallback isn't repeated within this many hours.
  history_hours: int(0,24)
  log_level: list(debug|info|warning|error)
  # HA entities over MQTT discovery. The app's own Mosquitto login, which the broker's ACL
  # limits to studio841/# and its discovery topics (DOCS.md). No login: no entities.
  # Not the Supervisor's MQTT service: that login reaches every topic, other apps' too.
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
